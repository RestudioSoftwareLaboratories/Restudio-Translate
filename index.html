<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restudio Translate</title>
    <!-- Tiny5 Font -->
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Black top bar */
        .top-bar {
            background-color: #000000;
            width: 100%;
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 1px solid #2c2c2c;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-img {
            height: 48px;
            width: auto;
            display: block;
            object-fit: contain;
            transition: transform 0.2s ease;
        }


        .translate-text {
            font-family: 'Tiny5', monospace;
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #ffffff;
            line-height: 1.2;
        }

        /* Main container */
        .main-container {
            max-width: 1400px;
            width: 92%;
            margin: 32px auto;
            flex: 1;
        }

        /* Language selector bar */
        .language-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .lang-select {
            background-color: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 32px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 500;
            color: #3c4043;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
            min-width: 180px;
        }

        .lang-select:hover {
            border-color: #1a73e8;
        }

        .lang-select:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }

        /* Tools bar */
        .tools-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: transparent;
            border: 1px solid #dadce0;
            padding: 8px 20px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 500;
            color: #3c4043;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .tool-btn:hover {
            background-color: #f1f3f4;
            border-color: #bdc1c6;
        }

        .tool-btn .material-icons {
            font-size: 18px;
        }

        .translate-btn {
            background-color: #1a73e8;
            border-color: #1a73e8;
            color: white;
        }

        .translate-btn:hover {
            background-color: #1557b0;
        }

        .translate-btn:disabled {
            background-color: #a0c4f0;
            cursor: not-allowed;
        }

        /* Panels */
        .panels-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 24px;
        }

        .panel {
            flex: 1;
            min-width: 300px;
            background-color: #ffffff;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid #e2e4e8;
            transition: all 0.2s;
        }

        .panel:hover {
            border-color: #bdc1c6;
        }

        .panel-header {
            padding: 14px 20px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #e2e4e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            font-size: 14px;
            color: #5f6368;
        }

        .panel-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background-color: #e8eaed;
        }

        .icon-btn .material-icons {
            font-size: 18px;
            color: #5f6368;
        }

        textarea {
            width: 100%;
            min-height: 280px;
            padding: 20px;
            font-size: 18px;
            font-family: inherit;
            border: none;
            outline: none;
            resize: vertical;
            background-color: #ffffff;
            color: #202124;
            line-height: 1.6;
        }

        textarea:focus {
            background-color: #ffffff;
        }

        #outputText {
            background-color: #fefefe;
        }

        .panel-footer {
            padding: 10px 20px;
            background-color: #fafafa;
            border-top: 1px solid #edf0f2;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #70757a;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            gap: 16px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-item .material-icons {
            font-size: 14px;
        }

        /* Footer with white background and black text */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #ffffff;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            border-top: 1px solid #e2e4e8;
        }

        .footer-logo {
            height: 28px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        .footer-text {
            font-size: 13px;
            color: #202124;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        @media (max-width: 700px) {
            .top-bar {
                padding: 12px 20px;
            }
            .logo-img {
                height: 36px;
            }
            .translate-text {
                font-size: 22px;
            }
            .lang-select {
                padding: 8px 16px;
                font-size: 13px;
                min-width: 140px;
            }
            textarea {
                min-height: 180px;
                font-size: 16px;
            }
            .footer-logo {
                height: 22px;
            }
            .footer-text {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- Black top bar -->
    <div class="top-bar">
        <div class="logo-area">
            <img class="logo-img" src="https://i.postimg.cc/8cFpdJWB/swrh-restudio.png" alt="Restudio Logo">
            <span class="translate-text">Translate</span>
        </div>
    </div>

    <div class="main-container">
        <!-- Language selection (5 languages) -->
        <div class="language-bar">
            <select id="srcLang" class="lang-select">
                <option value="ar">Arabic (العربية)</option>
                <option value="en" selected>English</option>
                <option value="es">Spanish (Español)</option>
                <option value="fr">French (Français)</option>
                <option value="zh">Chinese (中文)</option>
            </select>
            <span class="material-icons" style="color: #5f6368;">arrow_forward</span>
            <select id="tgtLang" class="lang-select">
                <option value="ar">Arabic (العربية)</option>
                <option value="en">English</option>
                <option value="es">Spanish (Español)</option>
                <option value="fr">French (Français)</option>
                <option value="zh" selected>Chinese (中文)</option>
            </select>
        </div>

        <!-- Tools bar -->
        <div class="tools-bar">
            <button class="tool-btn" id="copyLeftBtn">
                <span class="material-icons">content_copy</span> Copy
            </button>
            <button class="tool-btn" id="clearLeftBtn">
                <span class="material-icons">delete_sweep</span> Clear
            </button>
            <button class="tool-btn translate-btn" id="translateBtn">
                <span class="material-icons">translate</span>Translate
            </button>
            <button class="tool-btn" id="swapBtn">
                <span class="material-icons">swap_horiz</span> Swap
            </button>
            <button class="tool-btn" id="copyRightBtn">
                <span class="material-icons">content_copy</span> Copy Result
            </button>
            <button class="tool-btn" id="clearRightBtn">
                <span class="material-icons">delete_sweep</span> Clear Result
            </button>
        </div>

        <!-- Text panels -->
        <div class="panels-wrapper">
            <!-- Left panel: Source text -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="material-icons">description</span>
                        <span>Source Text</span>
                    </div>
                    <div class="panel-actions">
                        <button class="icon-btn" id="speakLeftBtn" title="Speak text">
                            <span class="material-icons">volume_up</span>
                        </button>
                        <button class="icon-btn" id="clearLeftIcon" title="Clear">
                            <span class="material-icons">backspace</span>
                        </button>
                    </div>
                </div>
                <textarea id="inputText" placeholder="Type or paste text here..."></textarea>
                <div class="panel-footer">
                    <div class="stats">
                        <div class="stat-item">
                            <span class="material-icons">text_fields</span>
                            <span id="leftCharCount">0</span> chars
                        </div>
                        <div class="stat-item">
                            <span class="material-icons">words</span>
                            <span id="leftWordCount">0</span> words
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right panel: Translated text -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="material-icons">translate</span>
                        <span>Translation</span>
                    </div>
                    <div class="panel-actions">
                        <button class="icon-btn" id="speakRightBtn" title="Speak translation">
                            <span class="material-icons">volume_up</span>
                        </button>
                        <button class="icon-btn" id="clearRightIcon" title="Clear">
                            <span class="material-icons">backspace</span>
                        </button>
                    </div>
                </div>
                <textarea id="outputText" placeholder="Translation will appear here..." readonly></textarea>
                <div class="panel-footer">
                    <div class="stats">
                        <div class="stat-item">
                            <span class="material-icons">text_fields</span>
                            <span id="rightCharCount">0</span> chars
                        </div>
                        <div class="stat-item">
                            <span class="material-icons">words</span>
                            <span id="rightWordCount">0</span> words
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer with white background and new logo -->
    <footer>
        <img class="footer-logo" src="https://i.postimg.cc/kXQHDMRp/swrh-restudio-nskht-(2).png" alt="Restudio Software Laboratories Logo">
    </footer>

    <script>
        // DOM elements
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const srcLangSelect = document.getElementById('srcLang');
        const tgtLangSelect = document.getElementById('tgtLang');
        const translateBtn = document.getElementById('translateBtn');

        // Web Speech API setup
        let currentUtterance = null;

        function stopSpeaking() {
            if (currentUtterance) {
                window.speechSynthesis.cancel();
                currentUtterance = null;
            }
        }

        function speakText(text, languageCode) {
            if (!text || text.trim() === "") return;
            
            stopSpeaking();
            
            const langMap = {
                'ar': 'ar-SA',
                'en': 'en-US',
                'es': 'es-ES',
                'fr': 'fr-FR',
                'zh': 'zh-CN'
            };
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langMap[languageCode] || 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            
            currentUtterance = utterance;
            window.speechSynthesis.speak(utterance);
            
            utterance.onend = () => {
                currentUtterance = null;
            };
        }

        function updateLeftStats() {
            const text = inputText.value;
            document.getElementById('leftCharCount').innerText = text.length;
            const words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
            document.getElementById('leftWordCount').innerText = words;
        }

        function updateRightStats() {
            const text = outputText.value;
            document.getElementById('rightCharCount').innerText = text.length;
            const words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
            document.getElementById('rightWordCount').innerText = words;
        }

        async function translateText() {
            const sourceText = inputText.value.trim();
            
            if (!sourceText) {
                outputText.value = '';
                updateRightStats();
                return;
            }
            
            const srcLang = srcLangSelect.value;
            const tgtLang = tgtLangSelect.value;
            
            translateBtn.innerHTML = '<span class="material-icons">hourglass_empty</span> Translating...';
            translateBtn.disabled = true;
            
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(sourceText)}&langpair=${srcLang}|${tgtLang}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data && data.responseData && data.responseData.translatedText) {
                    let translatedText = data.responseData.translatedText;
                    translatedText = translatedText.replace(/&#39;/g, "'").replace(/&quot;/g, '"');
                    outputText.value = translatedText;
                } else {
                    outputText.value = 'Translation failed. Please try again.';
                }
                updateRightStats();
            } catch (error) {
                console.error('Translation error:', error);
                outputText.value = `Error: ${error.message}. Check your internet connection.`;
                updateRightStats();
            } finally {
                translateBtn.innerHTML = '<span class="material-icons">translate</span> Translate';
                translateBtn.disabled = false;
            }
        }

        function swapLanguages() {
            const srcVal = srcLangSelect.value;
            const tgtVal = tgtLangSelect.value;
            srcLangSelect.value = tgtVal;
            tgtLangSelect.value = srcVal;
            translateText();
        }

        inputText.addEventListener('input', updateLeftStats);
        outputText.addEventListener('input', updateRightStats);
        
        document.getElementById('copyLeftBtn').addEventListener('click', () => {
            inputText.select();
            navigator.clipboard.writeText(inputText.value);
            alert('Source text copied');
        });
        
        document.getElementById('copyRightBtn').addEventListener('click', () => {
            outputText.select();
            navigator.clipboard.writeText(outputText.value);
            alert('Translation copied');
        });
        
        document.getElementById('clearLeftBtn').addEventListener('click', () => {
            inputText.value = '';
            updateLeftStats();
            stopSpeaking();
        });
        document.getElementById('clearRightBtn').addEventListener('click', () => {
            outputText.value = '';
            updateRightStats();
            stopSpeaking();
        });
        document.getElementById('clearLeftIcon').addEventListener('click', () => {
            inputText.value = '';
            updateLeftStats();
            stopSpeaking();
        });
        document.getElementById('clearRightIcon').addEventListener('click', () => {
            outputText.value = '';
            updateRightStats();
            stopSpeaking();
        });
        
        document.getElementById('speakLeftBtn').addEventListener('click', () => {
            const text = inputText.value.trim();
            const lang = srcLangSelect.value;
            speakText(text, lang);
        });
        
        document.getElementById('speakRightBtn').addEventListener('click', () => {
            const text = outputText.value.trim();
            const lang = tgtLangSelect.value;
            speakText(text, lang);
        });
        
        document.getElementById('swapBtn').addEventListener('click', swapLanguages);
        translateBtn.addEventListener('click', translateText);
        
        inputText.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                translateText();
            }
        });
        
        tgtLangSelect.addEventListener('change', translateText);
        srcLangSelect.addEventListener('change', translateText);
        
        updateLeftStats();
        updateRightStats();
        
        console.log('Restudio Translator ready!');
    </script>
</body>
</html>
